name: Fetch and Print Files (Python)

on:
  workflow_dispatch:

jobs:
  fetch-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch files with Python
        run: |
          python - <<'EOF'
          import requests

          urls = [
              "https://sniplist.mepaso.net/getxml.php?name=Die_Luther_Matrix_17.04.11_23-00_ard_90_TVOON_DE.",
              "http://cutlist.at/getxml.php?name=Broad_City__Die_Matrix_25.06.07_03-15_comedycentral_20_TVOON_DE."
          ]

          for i, url in enumerate(urls, start=1):
              print(f"\n===== Fetching file {i} =====")
              try:
                  r = requests.get(url, timeout=30)
                  r.raise_for_status()
                  print(r.text)
              except Exception as e:
                  print(f"Failed to fetch {url}: {e}")
          EOF
