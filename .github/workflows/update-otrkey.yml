name: Update otrkey files and cutlists

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:  # never two runs at once (e.g. a manual and a scheduled one)
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - name: Checkout full repo history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # we push with our own token

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests git-filter-repo

      - name: Update cutlists and fetch the mirror file lists
        run: |
          python download_otrkey_files.py
          mkdir /tmp/data
          cp otrkey_files.csv cutlists.csv.gz /tmp/data/
          zip -j /tmp/data/otrkey_files.zip otrkey_files.csv

      - name: Remove the history of the data files (keep code history)
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git-filter-repo --force --invert-paths \
            --path otrkey_files.csv --path otrkey_files.zip \
            --path cutlists.csv --path cutlists.csv.gz

      - name: Commit the fresh data files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          cp /tmp/data/* .
          git add otrkey_files.csv otrkey_files.zip cutlists.csv.gz
          git commit -m "⬇️ Update otrkey_files" || echo "No changes to commit."

      - name: Push rewritten history
        env:
          PAT: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          # Replace the branch only if nobody pushed since our checkout; otherwise
          # this run fails without overwriting anything and the next run catches up.
          git push --force-with-lease="${GITHUB_REF_NAME}:${BASE_SHA}" --no-tags \
            "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
